<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Airワーク原稿を取り込む | 0EN PoC</title><link rel="stylesheet" href="editor/style.css"><style>.generator{max-width:1060px;padding:32px 22px;margin:auto}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.results section.card{margin:0}.result-value{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}.source{white-space:pre-wrap;font-size:12px;max-height:200px;overflow:auto}.tag{font-size:12px;color:#285947}.tag.review{color:#955800}.import-actions{margin:24px 0;display:flex;gap:12px;flex-wrap:wrap}#input-text{min-height:280px}iframe{width:100%;height:850px;border:1px solid #d9ded5;border-radius:5px}#notices{font-size:13px}#message{white-space:pre-wrap} @media(max-width:650px){.results{grid-template-columns:1fr}}</style></head><body><header><span class="brand">0EN<span>WORK</span></span><span class="badge">原稿変換 PoC</span></header><main class="generator"><h1>Airワーク原稿を取り込む</h1><p>プレビュー全文を貼り付けてください。明確に取得できた項目だけを入力画面へ反映します。</p><section class="card"><label class="field"><span>求人プレビュー全文</span><textarea id="input-text" placeholder="Airワークの求人プレビューからコピーした文章"></textarea></label><button id="convert" type="button" class="primary">変換する</button><p class="hint">このページ内だけで解析します。入力を外部へ送信しません。</p></section><section class="card"><h2>CSV・TXTから選ぶ</h2><p class="hint">Airワークのタブ区切りTXTにも対応。ExcelファイルはTXT／CSVで出力してください。</p><input id="source-file" type="file" accept=".csv,.txt,.tsv"><label class="field"><span>文字コード</span><select id="encoding"><option value="utf-8">UTF-8（今回のTXT）</option><option value="shift_jis">Shift JIS</option><option value="utf-16le">UTF-16 LE</option></select></label><label class="field"><span>区切り文字</span><select id="delimiter"><option value="auto">自動確認</option><option value=",">カンマ（CSV）</option><option value="&#9;">タブ（TXT）</option></select></label><button id="read-file" type="button">ファイルを読み込む</button><p id="file-status" role="status"></p><div id="choose-job" hidden><label class="field"><span>変換する求人を1件選択</span><select id="job-list"></select></label><button id="convert-row" type="button" class="primary">選んだ求人を変換</button></div></section><p id="message" role="status"></p><ul id="notices"></ul><div id="results" class="results"></div><div id="import-actions" class="import-actions" hidden><button id="apply" type="button" class="primary">確認した内容を求人入力へ反映</button></div><section id="editor-section" hidden><h2>求人の入力・プレビュー</h2><p class="hint">未取得の条件は空欄です。6画面目で求人原稿を確認できます。反映ボタンをもう一度押すと、編集中の内容を置き換えます。</p><iframe id="editor" title="0EN求人入力PoC" src="editor/index.html"></iframe></section><p class="footnote">法令チェック・公開・保存は行いません。ページを更新すると入力は消えます。</p></main><script src="parser.js"></script><script src="csv-parser.js"></script><script src="generator.js"></script></body></html>
