<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="0EN WORKの仮データ詳細表示PoCです。">
  <title>WORK詳細 | 0EN WORK PoC</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../lp.css">
  <link rel="stylesheet" href="../../work-pages.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="work-page work-hub" data-page="detail">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="./" aria-label="0EN WORK PoC">0EN <span>WORK</span></a>
      <nav class="main-nav" aria-label="ページナビゲーション">
        <a href="./">WORK一覧</a>
        <a href="../../about-work/">WORKとは</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <section class="work-section work-section-white detail-section">
      <div class="work-inner">
        <a class="back-link" href="./">← WORK一覧へ戻る</a>
        <p id="detail-load-error" class="load-error" role="alert" hidden>WORKデータを読み込めませんでした。ローカルHTTPサーバーから開いてください。</p>
        <article id="work-detail" hidden>
          <p id="work-kind" class="work-kicker"></p>
          <h1 id="work-title"></h1>
          <p id="work-summary" class="detail-summary"></p>
          <div class="detail-meta" aria-label="WORKの共通情報">
            <dl class="meta-row"><dt>主体</dt><dd id="work-actor"></dd></dl>
            <dl class="meta-row"><dt>活動状態</dt><dd><span id="activity-status" class="status-chip"></span></dd></dl>
            <dl class="meta-row"><dt>0EN上の公開状態</dt><dd><span id="publication-status" class="status-chip status-publication"></span></dd></dl>
            <dl class="meta-row"><dt>カテゴリ</dt><dd id="work-categories"></dd></dl>
            <dl class="meta-row"><dt>最終更新</dt><dd id="work-updated"></dd></dl>
          </div>
          <section id="type-content" class="type-content" aria-labelledby="type-content-title">
            <p class="work-kicker">WORK DETAILS</p>
            <h2 id="type-content-title"></h2>
            <div id="type-content-body" class="type-content-body"></div>
          </section>
          <p class="fixture-notice detail-notice">表示確認用の架空データです。実在する募集・活動の情報ではありません。</p>
        </article>
        <p id="not-found" class="empty-state" hidden>該当するWORKが見つかりません。WORK一覧から選び直してください。</p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <div><a class="brand" href="./">0EN <span>WORK</span></a><p>Phase 1 一覧・詳細PoC</p></div>
      <nav class="work-footer-links" aria-label="関連ページ"><a href="./">WORK一覧</a><a href="../../about-work/">WORKとは</a><a href="../../">0ENトップ</a></nav>
    </div>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
