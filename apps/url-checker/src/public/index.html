<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人 URL 生存チェック β版</title><style>
body{font:16px system-ui,sans-serif;background:#f3f6fa;color:#17243a;margin:0}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:26px;margin-bottom:6px}p{line-height:1.6}.card{background:white;border:1px solid #dce3ed;border-radius:10px;padding:20px;margin:18px 0}label{font-weight:700;display:block;margin-bottom:8px}textarea{box-sizing:border-box;width:100%;height:180px;padding:12px;font:14px monospace;border:1px solid #9caac0;border-radius:6px}input{padding:8px;border:1px solid #9caac0;border-radius:6px}button{background:#1755a3;color:white;border:0;border-radius:6px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e9eff8;color:#173f71;margin:4px}.row{display:flex;gap:22px;align-items:end;flex-wrap:wrap}.notice{background:#fff7e3;border-left:4px solid #dca51c;padding:12px}.counts{display:flex;gap:12px;flex-wrap:wrap}.count{padding:10px;background:#edf3fb;border-radius:6px}.item{border-top:1px solid #e2e8f0;padding:12px 0;overflow-wrap:anywhere}.url{font-size:13px}small{color:#506077}.error{color:#a22020}h2{font-size:20px}h3{margin-bottom:6px}a{color:#1755a3}
</style></head><body><main><h1>求人 URL 生存チェック <small>β版</small></h1><p>URL を貼り付けて、掲載状態を確認します。</p><div class="notice">試作品です。判定根拠を確認し、実際の削除・修正は人が判断してください。URL パラメータの自動修正には対応していません。</div><section class="card"><label for="urls">URL リスト</label><p><strong>LTの指定URLでターゲティングを全部コピーしてそのままペーストしてください。</strong></p><textarea id="urls" placeholder="https://www.baitoru.com/jobdetail/123456789&#10;×&#10;https://example.com/recruit/"></textarea><div class="row"><div><label for="date">基準日（任意）</label><input id="date" type="date"><div><small>求人の掲載終了日が基準日より前なら削除候補</small></div></div><button id="run">掲載状況をチェック</button><button id="cancel" class="secondary" hidden>キャンセル</button><span id="status" role="status"></span></div><div id="progress-area" hidden><p id="progress-label">確認を準備中です</p><progress id="progress" max="1" value="0" aria-labelledby="progress-label" style="width:100%"></progress></div><p><small>最大 200 件。同一 URL は１件にまとめます。1 件ごとに間隔を設けます。</small></p></section><div id="results"></div></main><script>
const labels={keep:'維持',modify:'修正',delete:'削除',manual_check:'要確認'};let results=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function copy(s,button){let notice=button.parentElement.querySelector('.copy-status');if(!notice){notice=document.createElement('span');notice.className='copy-status';notice.setAttribute('role','status');button.insertAdjacentElement('afterend',notice)}navigator.clipboard.writeText(s).then(()=>{notice.textContent=' コピーしました'},()=>{notice.textContent=' コピーできませんでした'});}
function render(){let count=k=>results.filter(x=>x.result===k).length; let groups={}; for(const x of results){let key=x.jobId?'baitoru:'+x.jobId:'url:'+x.normalizedUrl;(groups[key]??=[]).push(x)}let dup=Object.values(groups).filter(g=>g.length>1);let ready=Object.values(groups).filter(g=>g.every(x=>['keep','modify'].includes(x.result))).map(g=>g[0].normalizedUrl); let conflicts=Object.values(groups).filter(g=>g.length>1 && g.some(x=>['keep','modify'].includes(x.result)) && g.some(x=>!['keep','modify'].includes(x.result))).length; const out=document.querySelector('#results');out.innerHTML=`<section class="card"><h2>貼付用 URL</h2><p>維持・修正の URL を重複を除いて出力します。要確認・削除を含む同一求人のグループは出力しません。判定が食い違う重複候補: ${conflicts} 組。</p><p class="notice"><strong>要確認 ${count('manual_check')} 件・削除 ${count('delete')} 件は貼付用に含まれません。</strong>要確認の扱いは、リストを更新する前に人が判断してください。</p><textarea id="delivery" readonly>${esc(ready.join('\n'))}</textarea><button id="copy-delivery">貼付用 URL をコピー</button></section>`+'<div class="counts">'+Object.keys(labels).map(k=>`<div class="count">${labels[k]} <strong>${count(k)}</strong> 件</div>`).join('')+'</div>'+`<p>抽出した URL ${results.length} 件。同じ求人番号の重複候補 ${dup.length} 組（統合していません）。同一求人 ID でも URL の違いを確認してください。</p>`+Object.keys(labels).map(k=>{let rows=results.filter(x=>x.result===k);return `<section class="card"><h2>${labels[k]} (${rows.length})</h2><button class="secondary" data-copy="id" data-key="${k}">案件番号をコピー</button><button class="secondary" data-copy="url" data-key="${k}">URL をコピー</button><button class="secondary" data-copy="detail" data-key="${k}">詳細をコピー</button>${rows.map(x=>`<div class="item"><strong>${esc(x.jobId||'案件番号なし')}</strong>　${esc(x.mediaType)}　終了日: ${esc(x.listingEndDate||'不明')}<br>${esc(x.reason)}<br><a class="url" href="${esc(x.originalUrl)}" target="_blank" rel="noopener noreferrer">${esc(x.originalUrl)}</a></div>`).join('')||'<p>該当なし</p>'}</section>`}).join('')+`<section class="card"><h2>次回削除候補</h2><p>終了日が早い順（維持・修正のみ、上位 10 件）</p>${results.filter(x=>['keep','modify'].includes(x.result)&&x.listingEndDate).sort((a,b)=>a.listingEndDate.localeCompare(b.listingEndDate)).slice(0,10).map(x=>`<div>${esc(x.jobId||x.originalUrl)}　${esc(x.listingEndDate)}</div>`).join('')||'該当なし'}</section>`;}
document.querySelector('#run').onclick=async()=>{let btn=document.querySelector('#run'),status=document.querySelector('#status');btn.disabled=true;document.querySelector('#urls').disabled=true;document.querySelector('#date').disabled=true;document.querySelector('#results').innerHTML='';results=[];let cancel=document.querySelector('#cancel');cancel.hidden=false;cancel.disabled=false;status.textContent='確認中です。件数に応じて時間がかかります。';let area=document.querySelector('#progress-area'),bar=document.querySelector('#progress'),label=document.querySelector('#progress-label');area.hidden=false;bar.max=1;bar.value=0;label.textContent='確認を準備中です';let poll=setInterval(async()=>{try{let p=await (await fetch('/api/progress',{cache:'no-store'})).json();if(p.total){bar.max=p.total;bar.value=p.completed;label.textContent=`${p.completed} / ${p.total} 件を確認`}}catch{}},800);try{let r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#urls').value,referenceDate:document.querySelector('#date').value})});let d=await r.json();if(!r.ok)throw Error(d.error);results=d.results;render();bar.max=results.length;bar.value=results.length;label.textContent=`${results.length} / ${results.length} 件を確認`;status.textContent='確認が完了しました';}catch(e){status.textContent=e.message.includes('キャンセル')?'キャンセルしました。結果は表示されません。':'エラー: '+e.message+'。入力を確認して再実行してください。'}finally{clearInterval(poll);cancel.hidden=true;btn.disabled=false;document.querySelector('#urls').disabled=false;document.querySelector('#date').disabled=false}};
for(const id of ['urls','date']) document.querySelector('#'+id).addEventListener('input',()=>{if(results.length){results=[];document.querySelector('#results').innerHTML='';document.querySelector('#progress-area').hidden=true;document.querySelector('#status').textContent='入力が変更されました。再度チェックしてください。'}});
document.querySelector('#cancel').onclick=async e=>{e.target.disabled=true;document.querySelector('#status').textContent='キャンセル中です…';try{await fetch('/api/cancel',{method:'POST'})}catch{document.querySelector('#status').textContent='キャンセル要求に失敗しました'}};
document.querySelector('#results').onclick=e=>{if(e.target.id==='copy-delivery'){copy(document.querySelector('#delivery').value,e.target);return}const b=e.target.closest('[data-copy]');if(!b)return;let rows=results.filter(x=>x.result===b.dataset.key);let lines=rows.map(x=>b.dataset.copy==='id'?x.jobId:b.dataset.copy==='url'?x.originalUrl:`${x.jobId||'番号なし'}\t${x.mediaType}\t${x.listingEndDate||'不明'}\t${x.reason}\t${x.originalUrl}`).filter(Boolean);copy(lines.join('\n'),b);};
</script></body></html>
